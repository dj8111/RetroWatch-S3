<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 54" width="118mm" height="54mm">
  <!-- 定義復古 Game Boy (DMG-01) 經典灰階與銘板質感 (寬版舒適型 118 x 54 mm) -->
  <defs>
    <!-- 經典 Game Boy 暖灰基底漸層 -->
    <linearGradient id="gbBodyGrey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCDAD3" />
      <stop offset="40%" stop-color="#D2D0C8" />
      <stop offset="80%" stop-color="#C7C4BC" />
      <stop offset="100%" stop-color="#BCB9B1" />
    </linearGradient>

    <!-- 經典 Game Boy 灰藍色螢幕護目鏡片 (Screen Bezel) -->
    <linearGradient id="gbScreenBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5E6573" />
      <stop offset="40%" stop-color="#4E5462" />
      <stop offset="100%" stop-color="#3D424E" />
    </linearGradient>
  </defs>

  <!-- ============================================================================== -->
  <!-- 1. 復古 Game Boy 經典灰基底 (118 x 54 mm, R2 圓角) -->
  <!-- ============================================================================== -->
  <rect x="0" y="0" width="118" height="54" rx="2" ry="2" fill="url(#gbBodyGrey)" stroke="#AFAEA6" stroke-width="0.3" />

  <!-- 外圍精細凹槽飾線 (經典模具線質感) -->
  <rect x="1.6" y="1.6" width="114.8" height="50.8" rx="1.5" ry="1.5" fill="none" stroke="#BAB8AF" stroke-width="0.4" />
  <rect x="2.4" y="2.4" width="113.2" height="49.2" rx="1.1" ry="1.1" fill="none" stroke="#FFFFFF" stroke-width="0.25" opacity="0.6" />

  <!-- ============================================================================== -->
  <!-- 2. 中央 2.4 吋螢幕視窗 (Game Boy 灰藍鏡片造型，中心 X=59.0, Y=28.0) -->
  <!-- ============================================================================== -->
  <!-- 經典灰藍色螢幕護目外框 (寬 63.0mm x 高 43.4mm，左側 X=23.5 ~ 86.5，避開右側按鍵至少 3.5mm) -->
  <rect x="23.5" y="5.8" width="63.0" height="43.4" rx="1.8" ry="1.8" fill="url(#gbScreenBezel)" stroke="#31353E" stroke-width="0.4" />
  <rect x="24.3" y="6.6" width="61.4" height="41.8" rx="1.2" ry="1.2" fill="none" stroke="#717988" stroke-width="0.25" opacity="0.7" />

  <!-- Game Boy 經典雙彩飾線 (深海藍 + 復古酒紅飾條) -->
  <line x1="25.5" y1="8.0" x2="84.5" y2="8.0" stroke="#1A2C5B" stroke-width="0.5" />
  <line x1="25.5" y1="8.7" x2="84.5" y2="8.7" stroke="#8B1D43" stroke-width="0.4" />

  <!-- 螢幕透明視窗實孔 (綠色虛線為沖壓/雷射裁切線，50.0 x 37.5 mm, 中心 X=59.0, Y=28.0) -->
  <rect x="34.0" y="9.25" width="50.0" height="37.5" fill="#FFFFFF" stroke="#00FF00" stroke-width="0.2" stroke-dasharray="1,1" />

  <!-- Game Boy 經典 BATTERY 指示燈開孔與印刷 (位於鏡片左側邊框 X=27.0, Y=24.0，對齊 3D 列印外殼直徑 2.0mm 貫穿孔) -->
  <!-- 3D 列印 / 沖壓貫穿孔開孔線 (直徑 2.0mm, 半徑 1.0mm) -->
  <circle cx="27.0" cy="24.0" r="1.0" fill="#FFFFFF" stroke="#00FF00" stroke-width="0.2" stroke-dasharray="0.8,0.5" />
  <circle cx="27.0" cy="24.0" r="0.6" fill="#D32F2F" />
  <circle cx="27.0" cy="24.0" r="0.25" fill="#FFAAAA" />
  <text x="27.0" y="27.2" font-family="system-ui, -apple-system, sans-serif" font-size="1.0" font-weight="bold" fill="#B8BDC7" text-anchor="middle" letter-spacing="0.1">BATTERY</text>

  <!-- 螢幕下方經典酒紅底雙裝飾細線 -->
  <line x1="46.0" y1="48.0" x2="72.0" y2="48.0" stroke="#8B1D43" stroke-width="0.35" />
  <line x1="50.0" y1="48.6" x2="68.0" y2="48.6" stroke="#1A2C5B" stroke-width="0.25" />

  <!-- ============================================================================== -->
  <!-- 3. 左側控制區開孔與經典 Game Boy 標籤 (中心 X=16.0，距螢幕鏡片達 7.5mm，手感極度寬敞) -->
  <!-- ============================================================================== -->
  <!-- 左上 POWER 滑動開關開孔 (8.4 x 3.6mm, 中心 X=16.0, Y=9.5) -->
  <rect x="11.8" y="7.7" width="8.4" height="3.6" rx="0.5" ry="0.5" fill="#FFFFFF" stroke="#00FF00" stroke-width="0.2" />
  <!-- Game Boy 經典 POWER 印刷字樣與箭頭 -->
  <text x="16.0" y="6.1" font-family="system-ui, -apple-system, sans-serif" font-size="1.7" font-weight="bold" fill="#1A2C5B" text-anchor="middle" letter-spacing="0.2">◀ POWER ▶</text>
  <text x="16.0" y="12.9" font-family="system-ui, -apple-system, sans-serif" font-size="1.2" font-weight="600" fill="#666666" text-anchor="middle">OFF · ON</text>

  <!-- 左側五向搖桿開孔 (直徑 8.5mm, 中心 X=16.0, Y=33.0) -->
  <!-- 經典十字鍵圓盤凹槽飾圈 -->
  <circle cx="16.0" cy="33.0" r="6.0" fill="#C2C0B8" stroke="#B0AEA6" stroke-width="0.35" />
  <circle cx="16.0" cy="33.0" r="4.25" fill="#FFFFFF" stroke="#00FF00" stroke-width="0.2" />

  <!-- 四向方向三角指示 (▲ ▼ ◀ ▶) -->
  <polygon points="16.0,25.4 14.5,27.2 17.5,27.2" fill="#2B2B2B" />
  <polygon points="16.0,40.6 14.5,38.8 17.5,38.8" fill="#2B2B2B" />
  <polygon points="8.4,33.0 10.2,31.5 10.2,34.5" fill="#2B2B2B" />
  <polygon points="23.6,33.0 21.8,31.5 21.8,34.5" fill="#2B2B2B" />

  <!-- 左下蜂鳴器 4 個出音孔 (直徑 1.3mm, 中心 Y=48.2) -->
  <circle cx="12.5" cy="48.2" r="0.65" fill="#FFFFFF" stroke="#00FF00" stroke-width="0.2" />
  <circle cx="14.8" cy="48.2" r="0.65" fill="#FFFFFF" stroke="#00FF00" stroke-width="0.2" />
  <circle cx="17.1" cy="48.2" r="0.65" fill="#FFFFFF" stroke="#00FF00" stroke-width="0.2" />
  <circle cx="19.4" cy="48.2" r="0.65" fill="#FFFFFF" stroke="#00FF00" stroke-width="0.2" />
  <!-- 經典斜向聲孔裝飾條 (Game Boy 經典揚聲器格柵風) -->
  <line x1="11.0" y1="45.6" x2="20.9" y2="45.6" stroke="#9E9C94" stroke-width="0.3" stroke-dasharray="1.2,0.8" />

  <!-- ============================================================================== -->
  <!-- 4. 右側按鍵開孔與經典 Game Boy 標籤 (無連接線，佈局寬裕不侷促，距螢幕邊框 >3.5mm) -->
  <!-- ============================================================================== -->
  <!-- PAUSE 鍵開孔 (6.0 x 2.8mm, 中心 X=93.0, Y=11.5) -->
  <rect x="90.0" y="10.1" width="6.0" height="2.8" rx="1.4" ry="1.4" fill="#FFFFFF" stroke="#00FF00" stroke-width="0.2" />
  <text x="93.0" y="8.5" font-family="system-ui, -apple-system, sans-serif" font-size="1.6" font-weight="bold" fill="#1A2C5B" text-anchor="middle" letter-spacing="0.2">PAUSE</text>

  <!-- START 鍵開孔 (6.0 x 2.8mm, 中心 X=105.0, Y=11.5) -->
  <rect x="102.0" y="10.1" width="6.0" height="2.8" rx="1.4" ry="1.4" fill="#FFFFFF" stroke="#00FF00" stroke-width="0.2" />
  <text x="105.0" y="8.5" font-family="system-ui, -apple-system, sans-serif" font-size="1.6" font-weight="bold" fill="#1A2C5B" text-anchor="middle" letter-spacing="0.2">START</text>

  <!-- B 鍵 (直徑 7.6mm, 中心 X=94.0, Y=37.0) -->
  <!-- Game Boy 經典按鍵沉槽底襯 (獨立單獨，無連接線！) -->
  <circle cx="94.0" cy="37.0" r="5.0" fill="#C2C0B8" stroke="#B0AEA6" stroke-width="0.35" />
  <circle cx="94.0" cy="37.0" r="3.8" fill="#FFFFFF" stroke="#00FF00" stroke-width="0.2" />
  <!-- 經典 Game Boy 傾斜酒紅深字標籤 -->
  <text x="94.0" y="46.2" font-family="system-ui, -apple-system, sans-serif" font-size="3.2" font-weight="bold" font-style="italic" fill="#8B1D43" text-anchor="middle">B</text>

  <!-- A 鍵 (直徑 7.6mm, 中心 X=104.0, Y=29.0) -->
  <!-- Game Boy 經典按鍵沉槽底襯 (獨立單獨，無連接線！) -->
  <circle cx="104.0" cy="29.0" r="5.0" fill="#C2C0B8" stroke="#B0AEA6" stroke-width="0.35" />
  <circle cx="104.0" cy="29.0" r="3.8" fill="#FFFFFF" stroke="#00FF00" stroke-width="0.2" />
  <!-- 經典 Game Boy 傾斜酒紅深字標籤 -->
  <text x="104.0" y="38.2" font-family="system-ui, -apple-system, sans-serif" font-size="3.2" font-weight="bold" font-style="italic" fill="#8B1D43" text-anchor="middle">A</text>
</svg>
